<title>小忍者切水果</title>
<style>
/* Layout: one fixed 960x540 stage, scaled to fit and letterboxed. Canvas sits underneath, HTML screens on top with pointer-events off so the blade still works on menus. Night-indigo ink, rice-paper buttons, vermilion and gold accents. */
:root{
  --ink:#12141f; --ink-2:#1d2133; --paper:#f4ead2; --paper-2:#e2d3ae;
  --red:#e0452f; --red-2:#a92d1d; --bamboo:#6fae5c; --gold:#f0bd3c; --ice:#9fdcf2;
  --f:'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink)}
body{color:var(--paper);font-family:var(--f);font-weight:500;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:var(--ink)}
#cv{position:absolute;left:0;top:0;width:960px;height:540px;display:block;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;pointer-events:none}
.screen>*{pointer-events:auto}
.screen.dim{background:rgba(10,12,22,.74);pointer-events:auto}
.logo{pointer-events:none}
.logo small{display:block;font-size:18px;letter-spacing:.5em;color:var(--gold);margin-bottom:12px;font-weight:800}
.logo h1{margin:0;font-weight:800;font-size:92px;line-height:1;letter-spacing:.04em;color:var(--paper);text-shadow:0 4px 0 var(--red),0 8px 0 var(--red-2),0 14px 24px rgba(0,0,0,.55)}
.ttl{margin:0;font-size:44px;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.hint{margin:0;font-size:20px;color:var(--paper-2);pointer-events:none}
.row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{font:800 24px/1 var(--f);color:var(--ink);background:var(--paper);border:0;border-radius:12px;padding:14px 28px;min-width:150px;box-shadow:0 5px 0 var(--paper-2),0 9px 18px rgba(0,0,0,.4);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--paper-2)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-2),0 9px 18px rgba(0,0,0,.4)}
.btn.red:active{box-shadow:0 1px 0 var(--red-2)}
.btn.sm{font-size:18px;padding:10px 18px;min-width:0}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.seg{display:flex;gap:8px}
.seg button{font:800 20px/1 var(--f);color:var(--paper);background:rgba(244,234,210,.12);border:2px solid rgba(244,234,210,.35);border-radius:999px;padding:10px 24px;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.corner{position:absolute;left:24px;top:16px;font-size:16px;opacity:.6;pointer-events:none}
.tgs{position:absolute;right:20px;top:14px;display:flex;gap:10px}
#stage-rows{display:flex;flex-direction:column;gap:14px;align-items:center}
.chap{margin:0 0 6px;font-weight:800;font-size:20px;color:var(--gold);letter-spacing:.3em}
.nodes{display:flex;gap:14px;justify-content:center}
.node{width:150px;padding:12px 8px;border:0;border-radius:12px;background:var(--paper);color:var(--ink);font:800 20px/1.25 var(--f);cursor:pointer;box-shadow:0 5px 0 var(--paper-2)}
.node small{display:block;font:500 15px/1.4 var(--f);opacity:.75}
.node .st{display:block;color:var(--red);font-size:20px;letter-spacing:.1em;margin-top:2px;min-height:24px}
.node:disabled{background:#3a3d4f;color:#8b8fa3;box-shadow:0 5px 0 #2a2c3a;cursor:default}
.node.boss{background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-2)}
.node.boss .st{color:var(--gold)}
.node.boss:disabled{background:#4a3038;color:#9a8088;box-shadow:0 5px 0 #2a2c3a}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{position:absolute}
#h-score{left:28px;top:14px;font:800 44px/1 var(--f);text-shadow:0 3px 0 rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
#h-goal{left:30px;top:66px;font-size:18px;color:var(--gold);font-weight:800}
#h-time{left:50%;top:14px;transform:translateX(-50%);font:800 40px/1 var(--f);font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.5)}
#h-hearts{right:96px;top:12px;font-size:34px;line-height:1;color:var(--red);letter-spacing:.08em;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#h-dbl{right:96px;top:56px;font:800 24px/1 var(--f);color:var(--gold)}
#h-boss{left:50%;top:62px;transform:translateX(-50%);width:380px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
#h-boss .bar{flex:1;height:16px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;border:2px solid var(--paper)}
#h-boss i{display:block;height:100%;width:100%;background:var(--red)}
#b-pause{right:22px;top:12px;width:54px;height:46px;border:0;border-radius:10px;background:rgba(244,234,210,.2);color:var(--paper);font:800 18px/1 var(--f);pointer-events:auto;cursor:pointer}
#b-skill{right:34px;bottom:44px;width:112px;height:112px;border-radius:50%;border:0;padding:0;background:conic-gradient(var(--gold) calc(var(--g,0)*1%),rgba(244,234,210,.22) 0);pointer-events:auto;cursor:pointer;font:800 26px/1 var(--f);color:var(--paper)}
#b-skill span{position:absolute;inset:9px;border-radius:50%;background:var(--ink-2);display:flex;align-items:center;justify-content:center}
#b-skill.ready span{background:var(--red);color:#fff}
#b-skill.ready{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#r-stars{font-size:64px;line-height:1;color:var(--gold);letter-spacing:.1em;min-height:66px}
#r-stars span{display:inline-block;opacity:0;animation:pop .45s ease-out forwards}
#r-stars span.off{color:rgba(244,234,210,.28)}
@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
#r-score{font:800 56px/1 var(--f);font-variant-numeric:tabular-nums}
input{font:800 26px/1 var(--f);color:var(--ink);background:var(--paper);border:0;border-radius:10px;padding:10px 16px;width:220px;text-align:center;-webkit-user-select:text;user-select:text;pointer-events:auto}
#card-img{height:330px;max-width:90%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto}
#rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--ink);color:var(--paper);font-size:24px;font-weight:800;text-align:center;padding:24px}
@media (orientation:portrait){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){#r-stars span{animation:none;opacity:1}#b-skill.ready{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="probe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>
<div id="rotate"><div style="font-size:64px" aria-hidden="true">⟲</div><div>請把手機橫過來玩</div></div>
<div id="stage">
<canvas id="cv"></canvas>

<section class="screen" id="sc-title">
  <div class="logo"><small>NINJA FRUITS</small><h1>小忍者切水果</h1></div>
  <div class="row">
    <button class="btn red" id="b-quest">挑戰關卡</button>
    <button class="btn" id="b-train">修行模式</button>
  </div>
  <div class="seg" id="seg-diff" role="group" aria-label="難度">
    <button data-d="easy">小忍者</button><button data-d="normal">忍者</button><button data-d="hard">上忍</button>
  </div>
  <p class="hint">用手指劃過水果。小心炸彈和手裡劍！</p>
  <div class="corner">v0.1</div>
  <div class="tgs"><button class="btn sm tg-mute"></button><button class="btn sm tg-eco"></button></div>
</section>

<section class="screen" id="sc-stages" hidden>
  <h2 class="ttl">選擇關卡</h2>
  <div id="stage-rows"></div>
  <p class="hint" id="s-diff"></p>
  <button class="btn sm" id="b-back1">‹ 返回</button>
</section>

<section class="screen dim" id="sc-pause" hidden>
  <h2 class="ttl">休息一下</h2>
  <div class="row">
    <button class="btn red" id="b-resume">繼續</button>
    <button class="btn" id="b-restart">重來</button>
    <button class="btn" id="b-quit">主選單</button>
  </div>
  <div class="row"><button class="btn sm tg-mute"></button><button class="btn sm tg-eco"></button></div>
</section>

<section class="screen dim" id="sc-result" hidden>
  <h2 class="ttl" id="r-title"></h2>
  <div id="r-stars"></div>
  <div id="r-score"></div>
  <p class="hint" id="r-sub"></p>
  <input id="r-name" maxlength="8" placeholder="忍者名字" autocomplete="off">
  <div class="row">
    <button class="btn red" id="r-again">再來一次</button>
    <button class="btn" id="r-next">下一關 ›</button>
  </div>
  <div class="row">
    <button class="btn sm" id="r-card">紀念卡</button>
    <button class="btn sm" id="r-stages">選關</button>
    <button class="btn sm" id="r-menu">主選單</button>
  </div>
</section>

<section class="screen dim" id="sc-card" hidden>
  <img id="card-img" alt="紀念卡">
  <p class="hint">長按圖片，存到相簿</p>
  <button class="btn sm" id="card-close">關閉</button>
</section>

<div id="hud" hidden>
  <div id="h-score">0</div>
  <div id="h-goal"></div>
  <div id="h-time"></div>
  <div id="h-hearts" aria-label="愛心"></div>
  <div id="h-dbl" hidden>×2</div>
  <div id="h-boss" hidden><span>大蛤蟆</span><div class="bar"><i id="h-bossfill"></i></div></div>
  <button id="b-pause" aria-label="暫停">❚❚</button>
  <button id="b-skill"><span>忍術</span></button>
</div>
</div>
<script>
'use strict';
/* ===== core: helpers, layout, save, audio, input ===== */
const W=960,H=540,GRAV=900;
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const FONT="'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif";
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

let S=1,K=1,SP=1;
function layout(){
  const cs=getComputedStyle($('probe'));
  const L=parseFloat(cs.paddingLeft)||0,R=parseFloat(cs.paddingRight)||0,T=parseFloat(cs.paddingTop)||0,B=parseFloat(cs.paddingBottom)||0;
  const sa=(navigator.standalone||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches);
  const T2=(sa&&!T)?8:T,B2=(sa&&!B)?14:B;
  const aw=Math.max(100,innerWidth-L-R),ah=Math.max(100,innerHeight-T-B);
  S=Math.min(aw/W,ah/H);
  stage.style.transform='translate('+(L+(aw-W*S)/2)+'px,'+(T2+(ah-H*S)/2)+'px) scale('+S+')';
  K=Math.min(S*Math.min(2,devicePixelRatio||1),2);
  cv.width=Math.round(W*K);cv.height=Math.round(H*K);
  SP=Math.max(1,Math.min(2,Math.ceil(K)));
  if(typeof buildAssets==='function')buildAssets();
}

/* ----- save ----- */
const SAVE_KEY='ninja-fruit-v1';
let save={diff:'normal',name:'',stage:{},train:{easy:0,normal:0,hard:0},sliced:0,eco:false,mute:false};
try{const r=localStorage.getItem(SAVE_KEY);if(r){const o=JSON.parse(r);save=Object.assign(save,o);save.train=Object.assign({easy:0,normal:0,hard:0},save.train||{});save.stage=save.stage||{};}}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* ----- audio (all synthesized) ----- */
let AC=null,master=null,NB=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function noise(dur,f0,f1,vol,q){
  if(!AC||save.mute)return;
  const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=q||1.2;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05);
}
function tone(freq,dur,vol,type,slide,delay){
  if(!AC||save.mute)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
const sfxSlice=()=>{noise(.16,5200,1400,.5,1.5);tone(900+Math.random()*300,.08,.08,'triangle',300)};
const sfxCombo=n=>{tone(520*Math.pow(1.122,Math.min(n,10)),.18,.18,'triangle')};
const sfxGold=()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,.2,.16,'triangle',0,i*.06))};
const sfxIce=()=>{tone(1800,.4,.14,'sine',700);tone(2400,.3,.08,'sine',900,.05)};
const sfxBomb=()=>{noise(.5,900,70,.9,.7);tone(120,.5,.4,'sine',35)};
const sfxClang=()=>{tone(1400,.25,.2,'square',900);noise(.15,4000,2000,.4)};
const sfxSkill=()=>{tone(220,.5,.25,'sawtooth',880);noise(.5,300,3000,.5)};
const sfxWin=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.3,.22,'triangle',0,i*.12))};
const sfxFail=()=>{[392,330,262].forEach((f,i)=>tone(f,.35,.2,'triangle',0,i*.16))};
function say(t){try{if(save.mute)return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=1.05;u.pitch=1.4;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ----- input: blade trails ----- */
const ptrs=new Map(),fading=[];
const nowS=()=>performance.now()/1000;
function lp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S,t:nowS()}}
cv.addEventListener('pointerdown',e=>{
  if(e.clientY>innerHeight-30)return;
  audioInit();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p={pts:[],n:0,lt:-9,last:null,id:e.pointerId};
  ptrs.set(e.pointerId,p);addPt(p,lp(e));e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of(evs.length?evs:[e]))addPt(p,lp(ev));
  e.preventDefault();
});
function endPtr(e){const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);fading.push(p)}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('lostpointercapture',endPtr);
function addPt(p,c){
  const prev=p.last;p.pts.push(c);p.last=c;
  if(prev)slashSeg(prev,c,p);
}
document.addEventListener('contextmenu',e=>{if(e.target.id!=='card-img')e.preventDefault()});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
/* ===== art: fruit sprites, backgrounds, ninja, toad ===== */
const FR=[
  {k:'wm',r:38,skin:'#3f9a4a',flesh:'#ef4a5f'},
  {k:'or',r:31,skin:'#f59a23',flesh:'#ffc04d'},
  {k:'ap',r:31,skin:'#d9302f',flesh:'#fff1c9'},
  {k:'le',r:30,skin:'#f3d93a',flesh:'#fff5a8'},
  {k:'pi',r:33,skin:'#f0b43c',flesh:'#fff08a'},
  {k:'pe',r:31,skin:'#f6a6a0',flesh:'#ffe3c2'}
];
const GOLD={k:'go',r:32,skin:'#f6c93a',flesh:'#fff3b0',gold:1};
const ICE={k:'ic',r:30,skin:'#9fdcf2',flesh:'#e8faff',ice:1};
const BOMB={k:'bo',r:30,skin:'#2a2d3d',flesh:'#ff9a3c',hz:1,bomb:1};
const STAR={k:'sh',r:30,skin:'#9aa3b5',flesh:'#e8eefc',hz:1};
const ALLDEF=[...FR,GOLD,ICE,BOMB,STAR];
let SPR={};const bgs=[];

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=amt<0?0:255,p=Math.abs(amt);
  return 'rgb('+Math.round((f-r)*p+r)+','+Math.round((f-g)*p+g)+','+Math.round((f-b)*p+b)+')';
}
function radial(g,r,c0,c1){const q=g.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);q.addColorStop(0,c0);q.addColorStop(1,c1);return q}
function body(g,r,d,rx,ry,oy){g.fillStyle=radial(g,r,shade(d.skin,.3),shade(d.skin,-.25));g.beginPath();g.ellipse(0,oy||0,rx,ry,0,0,7);g.fill()}
function hl(g,r){g.fillStyle='rgba(255,255,255,.38)';g.beginPath();g.ellipse(-r*.38,-r*.42,r*.2,r*.12,-.7,0,7);g.fill()}
function leaf(g,x,y,w,h,a,c){g.fillStyle=c||'#3c9a3a';g.beginPath();g.ellipse(x,y,w,h,a,0,7);g.fill()}

const DRAW={
  wm(g,r,d){body(g,r,d,r,r);g.save();g.beginPath();g.arc(0,0,r,0,7);g.clip();g.strokeStyle='#245c2e';g.lineWidth=5;g.lineCap='round';
    for(let i=-3;i<=3;i++){const x=i*r*.3;g.beginPath();g.moveTo(x,-r);g.quadraticCurveTo(x+(i<0?-9:9),0,x,r);g.stroke()}
    g.restore();hl(g,r)},
  or(g,r,d){body(g,r,d,r,r);g.fillStyle='rgba(190,90,0,.35)';for(let i=0;i<9;i++){g.beginPath();g.arc(Math.cos(i*2.1)*r*.55,Math.sin(i*3.3)*r*.5,1.6,0,7);g.fill()}
    leaf(g,r*.2,-r*.92,r*.3,r*.12,-.5);hl(g,r)},
  ap(g,r,d){body(g,r,d,r*.97,r*.95,r*.03);g.fillStyle=shade(d.skin,-.45);g.beginPath();g.ellipse(0,-r*.8,r*.24,r*.1,0,0,7);g.fill();
    g.strokeStyle='#6b4423';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(0,-r*.78);g.quadraticCurveTo(r*.05,-r*.95,r*.12,-r*1.02);g.stroke();
    leaf(g,r*.34,-r*.9,r*.3,r*.12,-.4);hl(g,r)},
  le(g,r,d){body(g,r,d,r,r*.8);g.fillStyle=d.skin;[-1,1].forEach(s=>{g.beginPath();g.arc(s*r*.98,0,r*.12,0,7);g.fill()});hl(g,r)},
  pi(g,r,d){body(g,r,d,r*.78,r*.88,r*.12);g.save();g.beginPath();g.ellipse(0,r*.12,r*.78,r*.88,0,0,7);g.clip();g.strokeStyle='rgba(120,70,0,.45)';g.lineWidth=2;
    for(let i=-4;i<=4;i++){g.beginPath();g.moveTo(i*14-40,-r);g.lineTo(i*14+40,r*1.1);g.stroke();g.beginPath();g.moveTo(i*14+40,-r);g.lineTo(i*14-40,r*1.1);g.stroke()}
    g.restore();g.fillStyle='#3f9a3f';
    for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*r*.14-r*.1,-r*.6);g.lineTo(i*r*.3,-r*1.0+Math.abs(i)*r*.1);g.lineTo(i*r*.14+r*.1,-r*.6);g.closePath();g.fill()}
    hl(g,r)},
  pe(g,r,d){body(g,r,d,r,r);g.strokeStyle='rgba(180,70,70,.5)';g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(0,-r*.8);g.quadraticCurveTo(r*.3,-r*.2,r*.1,r*.35);g.stroke();
    leaf(g,r*.3,-r*.9,r*.28,r*.11,-.4);hl(g,r)},
  go(g,r,d){body(g,r,d,r,r);g.strokeStyle='#b8861a';g.lineWidth=3;g.beginPath();g.arc(0,0,r-1.5,0,7);g.stroke();
    g.strokeStyle='rgba(184,134,26,.5)';g.lineWidth=2;g.beginPath();g.arc(0,0,r*.62,0,7);g.stroke();
    g.fillStyle='#fff';const sx=-r*.3,sy=-r*.3,q=r*.34;g.beginPath();g.moveTo(sx,sy-q);g.quadraticCurveTo(sx,sy,sx+q,sy);g.quadraticCurveTo(sx,sy,sx,sy+q);g.quadraticCurveTo(sx,sy,sx-q,sy);g.quadraticCurveTo(sx,sy,sx,sy-q);g.fill()},
  ic(g,r,d){const pts=[];for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2;pts.push([Math.cos(a)*r,Math.sin(a)*r])}
    g.fillStyle=radial(g,r,'#e8faff','#6fc3e6');g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=2;pts.forEach(p=>{g.beginPath();g.moveTo(0,0);g.lineTo(p[0],p[1]);g.stroke()});

  else if(reason==='hearts')win=false;
  else if(st.boss){win=reason==='boss';if(win)stars=G.lost===0?3:(G.lost<=2?2:1)}
  else{const tg=G.target;win=G.score>=tg;if(win)stars=G.score>=tg*1.5?3:(G.score>=tg*1.25?2:1)}
  G.win=win;G.stars=stars;G.reason=reason;G.run='ending';G.endT=0;G.shown=0;
  if(G.si===-1){G.best=save.train[G.diff]||0;G.newBest=G.score>G.best;if(G.newBest)save.train[G.diff]=G.score}
  else{
    const rec=save.stage[G.si]||(save.stage[G.si]={stars:0,best:{}});
    G.best=rec.best[G.diff]||0;G.newBest=G.score>G.best;
    rec.stars=Math.max(rec.stars,stars);if(G.newBest)rec.best[G.diff]=G.score;
  }
  persist();
  if(win){sfxWin();banner={t:1.6,max:1.6,txt:G.si===-1?'修行完成！':(st.boss?'打倒大蛤蟆！':'過關！'),sub:'',col:'#f0bd3c'}}
  else{sfxFail();banner={t:1.6,max:1.6,txt:reason==='hearts'?'愛心用完了':'時間到',sub:'',col:'#e2d3ae'}}
}
function update(dt){
  const sf=G.slow>0?.45:1,d=dt*sf,gr=GRAV*DIFF[G.diff].grav;
  G.t+=dt;
  if(G.slow>0)G.slow-=dt;if(G.dbl>0)G.dbl-=dt;if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt;
  if(G.slash>0)G.slash-=dt;if(G.toadHit>0)G.toadHit-=dt;if(G.toadOpen>0)G.toadOpen-=dt;
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
  for(const o of objs){o.vy+=gr*d;o.x+=o.vx*d;o.y+=o.vy*d;o.rot+=o.vr*d}
  objs=objs.filter(o=>!o.dead&&!(o.y>H+90&&o.vy>0));
  for(const h of halves){h.vy+=gr*d;h.x+=h.vx*d;h.y+=h.vy*d;h.rot+=h.vr*d;h.life-=dt}
  halves=halves.filter(h=>h.y<H+120&&h.life>0);
  for(const p of parts){p.vy+=p.g*d;p.x+=p.vx*d;p.y+=p.vy*d;p.life-=dt}
  parts=parts.filter(p=>p.life>0);
  for(const p of pops){p.y-=40*dt;p.life-=dt}
  pops=pops.filter(p=>p.life>0);
  ptrsFadeCleanup();
  if(G.run==='idle'){G.idleT-=dt;if(G.idleT<=0){G.idleT=rand(1.4,2.4);launch(rollDef(true))}}
  else if(G.run==='play')playUpdate(dt);
  else if(G.run==='ending'){G.endT+=dt;if(G.endT>1.1&&!G.shown){G.shown=1;showResult()}}
}
function ptrsFadeCleanup(){
  const t=nowS();
  for(let i=fading.length-1;i>=0;i--){const p=fading[i];while(p.pts.length&&p.pts[0].t<t-.25)p.pts.shift();if(!p.pts.length)fading.splice(i,1)}
  for(const p of ptrs.values())while(p.pts.length&&p.pts[0].t<t-.25)p.pts.shift();
  return 0;
}
function playUpdate(dt){
  if(G.ready>0){G.ready-=dt;return}
  const st=curStage(),dc=DIFF[G.diff],boss=st&&st.boss;
  if(!boss){G.time-=dt;if(G.time<=0){G.time=0;finish('time');return}}
  for(let i=queue.length-1;i>=0;i--){const q=queue[i];q.t-=dt;if(q.t<=0){launch(q.def,q.mouth);queue.splice(i,1)}}
  for(let i=skillQ.length-1;i>=0;i--){
    const q=skillQ[i];q.t-=dt;
    if(q.t<=0){skillQ.splice(i,1);if(!q.o.dead){if(q.o.hz){q.o.dead=true;juice(q.o.x,q.o.y,q.o.def,8)}else sliceObj(q.o,rand(0,6.28),fakeP)}}
  }
  if(G.run!=='play')return;
  G.spawnT-=dt;
  if(G.spawnT<=0){spawnBurst();G.spawnT=rand(dc.gap[0],dc.gap[1])*(st?st.pace:1)*(boss?1.9:1)}
  if(boss&&!G.bossDown){
    G.spitT-=dt;if(G.spitT<=0){G.spitT=dc.spit;G.toadOpen=.55;G.spitQ=.3}
    if(G.spitQ>0){G.spitQ-=dt;if(G.spitQ<=0)spitFruits()}
  }
}
/* ===== drawing ===== */
function drawObj(o){
  const s=SPR[o.def.k],n=o.def.r+4;
  if(o.def.gold){ctx.fillStyle='rgba(240,189,60,.28)';ctx.beginPath();ctx.arc(o.x,o.y,o.r+9,0,7);ctx.fill()}
  if(o.def.ice){ctx.fillStyle='rgba(159,220,242,.28)';ctx.beginPath();ctx.arc(o.x,o.y,o.r+9,0,7);ctx.fill()}
  ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.drawImage(s,-n,-n,n*2,n*2);ctx.restore();
}
function drawHalf(h){
  const r=h.def.r,n=r+4;
  ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot);ctx.rotate(h.la);
  ctx.globalAlpha=clamp(h.life*2,0,1);
  ctx.beginPath();ctx.rect(-r*1.4,h.side<0?-r*1.4:0,r*2.8,r*1.4);ctx.clip();
  ctx.rotate(-h.la);ctx.drawImage(SPR[h.def.k],-n,-n,n*2,n*2);ctx.rotate(h.la);
  ctx.fillStyle=h.def.flesh;ctx.fillRect(-r*.95,h.side<0?-5:0,r*1.9,5);
  ctx.restore();
}
function drawTrails(){
  const t=nowS(),all=[...ptrs.values(),...fading];
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const p of all){
    const a=p.pts.filter(q=>t-q.t<.22);if(a.length<2)continue;
    for(let i=1;i<a.length;i++){
      const age=(t-a[i].t)/.22,al=1-age;
      if(!save.eco){ctx.strokeStyle='rgba(240,189,60,'+(al*.35)+')';ctx.lineWidth=16*al+2;ctx.beginPath();ctx.moveTo(a[i-1].x,a[i-1].y);ctx.lineTo(a[i].x,a[i].y);ctx.stroke()}
      ctx.strokeStyle='rgba(255,255,255,'+al+')';ctx.lineWidth=7*al+1;ctx.beginPath();ctx.moveTo(a[i-1].x,a[i-1].y);ctx.lineTo(a[i].x,a[i].y);ctx.stroke();
    }
  }
}
function bgIndex(){const st=curStage();return st?st.bg:0}
function draw(ts){
  ctx.setTransform(K,0,0,K,0,0);
  ctx.drawImage(getBG(bgIndex()),0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate(rand(-6,6)*Math.min(1,G.shake*3),rand(-6,6)*Math.min(1,G.shake*3));
  const st=curStage();
  if(st&&st.boss&&G.run!=='idle')drawToad(ctx,ts);
  drawNinja(ctx,88,H-44,ts,G.slash);
  for(const h of halves)drawHalf(h);
  for(const o of objs)drawObj(o);
  for(const p of parts){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  ctx.restore();
  drawTrails();
  if(G.slow>0){ctx.fillStyle='rgba(120,200,255,.12)';ctx.fillRect(0,0,W,H)}
  if(G.flash>0){ctx.globalAlpha=clamp(G.flash*1.4,0,.42);ctx.fillStyle=G.flashC;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of pops){
    ctx.globalAlpha=clamp(p.life/p.max*1.5,0,1);ctx.font='800 '+p.size+'px '+FONT;
    ctx.lineWidth=5;ctx.strokeStyle='rgba(18,20,31,.8)';ctx.strokeText(p.txt,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);
  }
  ctx.globalAlpha=1;
  if(G.run==='play'&&G.ready>0){
    ctx.font='800 84px '+FONT;ctx.lineWidth=8;ctx.strokeStyle='rgba(18,20,31,.85)';
    ctx.strokeText(G.ready>.35?'準備！':'開始！',W/2,H/2);ctx.fillStyle='#f4ead2';ctx.fillText(G.ready>.35?'準備！':'開始！',W/2,H/2);
  }
  if(banner){
    const age=banner.max-banner.t,sc=1+Math.max(0,.25-age)*3,al=clamp(banner.t*3,0,1);
    ctx.save();ctx.globalAlpha=al;ctx.translate(W/2,H/2-30);ctx.scale(sc,sc);
    ctx.font='800 '+(banner.txt==='6 7!'?150:96)+'px '+FONT;ctx.lineWidth=12;ctx.strokeStyle='rgba(18,20,31,.9)';
    ctx.strokeText(banner.txt,0,0);ctx.fillStyle=banner.col;ctx.fillText(banner.txt,0,0);
    if(banner.sub){ctx.font='800 36px '+FONT;ctx.lineWidth=7;ctx.strokeText(banner.sub,0,86);ctx.fillStyle='#f4ead2';ctx.fillText(banner.sub,0,86)}
    ctx.restore();
  }
}

/* ===== HUD ===== */
const hud={};
function setT(id,v){if(hud[id]!==v){hud[id]=v;$(id).textContent=v}}
function updateHUD(){
  if($('hud').hidden)return;
  const st=curStage(),boss=st&&st.boss;
  setT('h-score',String(G.score));
  setT('h-time',boss?'':String(Math.ceil(Math.max(0,G.time))));
  setT('h-hearts',G.si===-1?'':'♥'.repeat(G.hearts)+'♡'.repeat(Math.max(0,G.maxHearts-G.hearts)));
  const tg=G.si===-1?'修行：沒有炸彈':(boss?'':'目標 '+G.target);
  setT('h-goal',tg);
  $('h-boss').hidden=!boss;
  if(boss){const w=(G.bossHp/Math.max(1,G.bossMax)*100).toFixed(1)+'%';if(hud.bw!==w){hud.bw=w;$('h-bossfill').style.width=w}}
  const g=Math.round(G.gauge);if(hud.g!==g){hud.g=g;$('b-skill').style.setProperty('--g',g);$('b-skill').classList.toggle('ready',g>=100)}
  const dbl=G.dbl>0;if(hud.dbl!==dbl){hud.dbl=dbl;$('h-dbl').hidden=!dbl}
}

/* ===== screens ===== */
function showScreen(id){for(const s of document.querySelectorAll('.screen'))s.hidden=(s.id!==id)}
function showHUD(on){$('hud').hidden=!on;if(on)for(const k in hud)delete hud[k]}
function toMenu(){G.run='idle';objs=[];halves=[];parts=[];pops=[];queue=[];skillQ=[];banner=null;G.si=-1;showHUD(false);showScreen('sc-title')}
function startRun(si){resetRun(si);showScreen(null);showHUD(true);audioInit()}
function pauseGame(){if(G.run!=='play')return;G.run='pause';showScreen('sc-pause')}
function resumeGame(){if(G.run!=='pause')return;G.run='play';showScreen(null)}
function renderStages(){
  const box=$('stage-rows');box.innerHTML='';
  for(const ch of[1,2]){
    const wrap=document.createElement('div'),h=document.createElement('p'),row=document.createElement('div');
    const first=STAGES.find(s=>s.ch===ch);
    h.className='chap';h.textContent='第 '+ch+' 章 · '+first.chn;row.className='nodes';
    STAGES.forEach((s,i)=>{
      if(s.ch!==ch)return;
      const b=document.createElement('button'),rec=save.stage[i],n=rec?rec.stars:0,ok=unlocked(i);
      b.className='node'+(s.boss?' boss':'');b.disabled=!ok;b.dataset.i=i;
      b.innerHTML=(s.boss?'魔王戰':'第 '+(i+1)+' 關')+'<small>'+s.name+'</small><span class="st">'+(ok?'★'.repeat(n)+'☆'.repeat(3-n):'未解鎖')+'</span>';
      row.appendChild(b);
    });
    wrap.appendChild(h);wrap.appendChild(row);box.appendChild(wrap);
  }
  $('s-diff').textContent='目前難度：'+DIFF[save.diff].name;
}
function syncUI(){
  document.querySelectorAll('#seg-diff button').forEach(b=>b.classList.toggle('on',b.dataset.d===save.diff));
  document.querySelectorAll('.tg-mute').forEach(b=>b.textContent='音效：'+(save.mute?'關':'開'));
  document.querySelectorAll('.tg-eco').forEach(b=>b.textContent='省電：'+(save.eco?'開':'關'));
}
function showResult(){
  showHUD(false);
  const st=curStage();
  $('r-title').textContent=G.si===-1?'修行完成':(G.win?(st.boss?'打倒大蛤蟆！':'過關！'):'再接再厲');
  let s='';if(G.si!==-1)for(let i=0;i<3;i++)s+='<span class="'+(i<G.stars?'':'off')+'" style="animation-delay:'+(i*.25)+'s">★</span>';
  $('r-stars').innerHTML=s;
  $('r-score').textContent=G.score+' 分';
  const tg=G.target&&!(st&&st.boss)&&G.si>=0?'　目標 '+G.target:'';
  $('r-sub').textContent=(G.newBest&&G.score>0?'新紀錄！':'最高 '+G.best)+'　難度：'+DIFF[G.diff].name+tg;
  $('r-name').value=save.name||'';
  const nx=G.si>=0&&G.win&&G.si+1<STAGES.length;
  $('r-next').hidden=!nx;
  $('r-card').hidden=!(G.win||G.si===-1);
  showScreen('sc-result');
}
function makeCard(){
  const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d');
  g.drawImage(getBG(bgIndex()),0,0,W,H);g.fillStyle='rgba(18,20,31,.55)';g.fillRect(0,0,W,H);
  g.fillStyle='#f4ead2';rr(g,70,50,820,440,22);g.fill();
  g.strokeStyle='#e0452f';g.lineWidth=6;rr(g,86,66,788,408,14);g.stroke();
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#e0452f';g.font='800 30px '+FONT;g.fillText('小忍者切水果',W/2,112);
  g.fillStyle='#12141f';g.font='800 58px '+FONT;g.fillText((save.name||'無名')+' 忍者',W/2,185);
  const st=curStage();
  g.font='500 28px '+FONT;g.fillText((G.si===-1?'修行模式':'第 '+(G.si+1)+' 關 '+st.name)+' · '+DIFF[G.diff].name,W/2,245);
  g.fillStyle='#e0452f';g.font='800 100px '+FONT;g.fillText(G.score+' 分',W/2,330);
  if(G.si!==-1){g.font='800 56px '+FONT;g.fillStyle='#f0bd3c';g.strokeStyle='#a92d1d';g.lineWidth=2;const t='★'.repeat(G.stars)+'☆'.repeat(3-G.stars);g.strokeText(t,W/2,410);g.fillText(t,W/2,410)}
  g.fillStyle='#6b6350';g.font='500 22px '+FONT;const d=new Date();
  g.fillText(d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' · 切了 '+G.sliced+' 個水果',W/2,452);
  $('card-img').src=c.toDataURL('image/png');
  showScreen('sc-card');
}

/* ===== wiring ===== */
$('b-quest').onclick=()=>{renderStages();showScreen('sc-stages')};
$('b-train').onclick=()=>startRun(-1);
$('b-back1').onclick=()=>showScreen('sc-title');
$('stage-rows').addEventListener('click',e=>{const b=e.target.closest('.node');if(b&&!b.disabled)startRun(+b.dataset.i)});
$('seg-diff').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;save.diff=b.dataset.d;G.diff=save.diff;persist();syncUI()});
$('b-pause').onclick=pauseGame;
$('b-resume').onclick=resumeGame;
$('b-restart').onclick=()=>startRun(G.si);
$('b-quit').onclick=toMenu;
$('b-skill').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();useSkill()});
$('r-again').onclick=()=>startRun(G.si);
$('r-next').onclick=()=>startRun(G.si+1);
$('r-card').onclick=makeCard;
$('r-stages').onclick=()=>{G.run='idle';renderStages();showScreen('sc-stages')};
$('r-menu').onclick=toMenu;
$('card-close').onclick=()=>showScreen('sc-result');
$('r-name').addEventListener('input',e=>{save.name=e.target.value.slice(0,8);persist()});
document.querySelectorAll('.tg-mute').forEach(b=>b.onclick=()=>{save.mute=!save.mute;persist();syncUI()});
document.querySelectorAll('.tg-eco').forEach(b=>b.onclick=()=>{save.eco=!save.eco;persist();syncUI()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
addEventListener('resize',()=>{layout();if(innerHeight>innerWidth)pauseGame()});
addEventListener('orientationchange',()=>setTimeout(()=>{layout();if(innerHeight>innerWidth)pauseGame()},200));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{bgs.length=0});

let lastTs=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(ts-lastTs<(save.eco?32:15))return;
  const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;
  if(G.run!=='pause')update(dt);else ptrsFadeCleanup();
  draw(ts/1000);updateHUD();
}
G.diff=save.diff;
layout();syncUI();showScreen('sc-title');showHUD(false);
requestAnimationFrame(frame);

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
